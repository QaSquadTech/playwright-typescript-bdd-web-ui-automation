name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright BDD tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        # Tests run headed (see playwright.config.ts) — xvfb provides a virtual display on CI.
        run: xvfb-run -a npm run test:bdd

      - name: Generate multiple-cucumber HTML report
        if: ${{ !cancelled() }}
        # generate-multiple-html-reports.ts scans reports/*.json, but the BDD
        # reporter writes reports/cucumber-json/report.json — copy it up first.
        run: |
          cp reports/cucumber-json/report.json reports/report.json
          npm run test:report

      - name: Upload Cucumber HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: reports/
          retention-days: 30

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright-html/
          retention-days: 30
